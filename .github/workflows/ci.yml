name: python-scaffold-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/validate_structure.py
      - run: python -m pytest
      - name: A05-A07 offline retrieval and citation smoke
        run: |
          PYTHONPATH=projects/p1_agent_harness/src python -m agent_harness.grounded_demo --question 'refund proposal human approval'
          PYTHONPATH=projects/p1_agent_harness/src python -m agent_harness.retrieval_eval
          python scripts/check_progress.py
      - name: A08-A10 offline scoped memory and multi-agent smoke
        run: |
          PYTHONPATH=projects/p1_agent_harness/src python -m agent_harness.team_demo --remember 'preferred_language=English'
          python scripts/check_progress.py
      # TODO: add lint/security checks and dependency pinning after scaffold.
