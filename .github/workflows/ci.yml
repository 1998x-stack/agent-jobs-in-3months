name: python-scaffold-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/validate_structure.py
      - run: python -m pytest
      # TODO: add lint/security checks and dependency pinning after scaffold.
