[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-jobs-in-3months"
version = "0.1.0"
description = "Code-first AI Agent Engineering learning scaffold"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests", "projects"]
pythonpath = [
  "projects/p1_agent_harness/src",
  "projects/p2_cloud_runtime/src",
  "projects/p3_eval_learning_lab/src"
]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
