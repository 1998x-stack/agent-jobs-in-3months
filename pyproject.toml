[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-jobs-in-3months"
version = "0.4.0"
description = "Code-first AI Agent Engineering learning scaffold"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7", "fastapi>=0.115,<1", "httpx>=0.27,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
llm = ["openai>=1.70,<4"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests", "projects"]
pythonpath = [
  "projects/p1_agent_harness/src",
  "projects/p2_cloud_runtime/src",
  "projects/p3_eval_learning_lab/src"
]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
